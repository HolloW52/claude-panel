<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Claude Code</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f2f1ef; --card: #fbfbfa; --line: #e5e3df; --text: #2f2e33; --muted: #8b8891;
    --accent: #9f9ac8; --accent-text: #6f69a3; --accent-soft: #eceaf5; --sage: #9cbca5; --sleep: #cdc9c4;
    --mine: #e9e7f4; --code-bg: #f0eff3; --code-head: #e6e4ee; --quote: #b5b0d6;
    --safe-top: max(var(--tg-safe-area-inset-top, 0px), env(safe-area-inset-top, 0px));
    --safe-bottom: max(var(--tg-safe-area-inset-bottom, 0px), env(safe-area-inset-bottom, 0px));
    --content-top: var(--tg-content-safe-area-inset-top, 0px);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Segoe UI", "Open Sans", "Helvetica Neue", sans-serif;
    --mono: "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1f; --card: #26262a; --line: #323238; --text: #e8e7ec; --muted: #8d8a95;
    --accent: #958fc2; --accent-text: #b4afe0; --accent-soft: #2e2d38; --sage: #8aab94; --sleep: #504e55;
    --mine: #343243; --code-bg: #1f1f24; --code-head: #2b2a33; --quote: #7d78a8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
    touch-action: manipulation; overscroll-behavior: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
  .app { position: fixed; inset: 0; height: var(--tg-viewport-height, 100%); overflow: hidden; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg);
    transition: transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s; }
  .view.hidden-right { transform: translateX(100%); pointer-events: none; }
  .view.hidden-left { transform: translateX(-22%); opacity: 0; pointer-events: none; }

  /* шапка */
  .top { flex: none; display: flex; align-items: center; gap: 6px; min-height: 52px;
    padding: calc(var(--safe-top) + var(--content-top) + 6px) 10px 6px; background: var(--bg); }
  .top h1 { flex: 1; margin: 0 6px; min-width: 0; font-size: 18px; font-weight: 600; letter-spacing: -.1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .sub { display: block; font-size: 13px; font-weight: 400; color: var(--muted); margin-top: 1px; }
  .icon { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .icon:active { background: var(--accent-soft); }
  .icon svg { width: 22px; height: 22px; }
  .scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .pad { padding: 4px 14px calc(var(--safe-bottom) + 20px); }
  h2 { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 14px 6px 8px; }

  /* список сессий */
  .list { background: var(--card); border-radius: 16px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 70px; right: 0; border-top: 1px solid var(--line); }
  .tap { cursor: pointer; transition: background .15s; }
  .tap:active { background: var(--accent-soft); }
  .ava { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center;
    font-weight: 600; font-size: 17px; color: #fff; position: relative; }
  .ava .dot { position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border: 2.5px solid var(--card); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--sleep); }
  .dot.work { background: var(--sage); animation: pulse 1.6s ease-in-out infinite; }
  .dot.idle { background: var(--accent); }
  @keyframes pulse { 50% { opacity: .4; } }
  .grow { flex: 1; min-width: 0; }
  .line1 { display: flex; align-items: baseline; gap: 8px; }
  .line1 b { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line1 time { font-size: 13px; color: var(--muted); flex: none; }
  .line2 { display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 14px; color: var(--muted); }
  .line2 span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { min-width: 9px; height: 9px; border-radius: 5px; background: var(--accent); flex: none; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-text); flex: none; }
  .note { font-size: 13px; color: var(--muted); margin: 10px 6px 0; line-height: 1.45; }
  .banner { margin: 0 14px 8px; padding: 10px 14px; border-radius: 14px; font-size: 14px;
    background: var(--accent-soft); color: var(--accent-text); display: none; }
  .banner.on { display: block; }
  .empty { padding: 26px 16px; color: var(--muted); text-align: center; font-size: 15px; }
  .skeleton { height: 64px; margin: 1px 0; background: linear-gradient(90deg, var(--card), var(--accent-soft), var(--card));
    background-size: 200% 100%; animation: shimmer 1.2s infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* переписка */
  .chat { padding: 6px 10px 10px; display: flex; flex-direction: column; gap: 4px; }
  .day { align-self: center; font-size: 13px; color: var(--muted); background: var(--accent-soft);
    padding: 3px 10px; border-radius: 12px; margin: 10px 0 6px; }
  .msg { position: relative; max-width: min(88%, 620px); padding: 7px 11px 6px; border-radius: 16px; background: var(--card);
    font-size: 16px; line-height: 1.38; word-wrap: break-word; overflow-wrap: anywhere; align-self: flex-start;
    border-bottom-left-radius: 6px; user-select: text; -webkit-user-select: text; }
  .msg.user { align-self: flex-end; background: var(--mine); border-bottom-left-radius: 16px; border-bottom-right-radius: 6px; }
  .msg + .msg.user, .msg.user + .msg:not(.user) { margin-top: 6px; }
  .msg .time { float: right; font-size: 12px; color: var(--muted); margin: 8px 0 -3px 10px; line-height: 1; }
  .msg p { margin: 0 0 7px; } .msg p:last-of-type { margin-bottom: 0; }
  .msg b, .msg strong { font-weight: 600; }
  .msg a { color: var(--accent-text); text-decoration: none; }
  .msg code { font: .88em var(--mono); color: var(--accent-text); background: var(--code-bg); padding: 1px 5px; border-radius: 5px; }
  .msg blockquote { margin: 4px 0 7px; padding: 2px 0 2px 10px; border-left: 3px solid var(--quote); border-radius: 2px; color: var(--muted); }
  .code { margin: 6px 0 8px; border-radius: 10px; overflow: hidden; background: var(--code-bg); border-left: 3px solid var(--quote); }
  .code-head { display: flex; align-items: center; padding: 5px 10px; background: var(--code-head);
    font-size: 13px; font-weight: 500; color: var(--accent-text); }
  .code-head span { flex: 1; }
  .code-head button { font-size: 13px; color: var(--muted); }
  .code pre { margin: 0; padding: 8px 10px; overflow-x: auto; font: 13.5px/1.45 var(--mono); white-space: pre; color: var(--text); }
  .pending { align-self: flex-end; font-size: 13px; color: var(--muted); margin: 1px 4px 4px; }
  .composer { flex: none; display: flex; align-items: flex-end; gap: 8px; background: var(--bg);
    padding: 8px 10px calc(var(--safe-bottom) + 8px); border-top: 1px solid var(--line); }
  .composer textarea { flex: 1; resize: none; border: 0; background: var(--card); color: var(--text); border-radius: 20px;
    padding: 10px 16px; font: 16px/1.35 var(--font); max-height: 150px; outline: none; }
  .composer textarea::placeholder { color: var(--muted); }
  .send { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center;
    flex: none; transition: opacity .15s, transform .15s; }
  .send:disabled { opacity: 0; transform: scale(.6); pointer-events: none; }
  .send svg { width: 20px; height: 20px; }
  .make-main { font-size: 13px; padding: 6px 11px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-text); flex: none; }

  /* настройки */
  .opt { padding: 13px 14px; }
  .opt + .opt { border-top: 1px solid var(--line); }
  .opt label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 9px; }
  .seg { display: flex; background: var(--bg); border-radius: 11px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; font-size: 14px; padding: 8px 4px; border-radius: 9px; transition: background .15s; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.08); font-weight: 500; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 84px); transform: translate(-50%, 20px); opacity: 0;
    background: var(--text); color: var(--bg); font-size: 14px; padding: 9px 16px; border-radius: 18px; transition: .25s; pointer-events: none; }
  .toast.on { opacity: .92; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div class="app">

<section class="view" id="v-list">
  <div class="top">
    <h1>Claude Code<span class="sub" id="list-sub">подключение…</span></h1>
    <button class="icon" id="to-settings" aria-label="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
  <div class="banner" id="offline">Компьютер не на связи — открой VS Code, панель подключится сама.</div>
  <div class="scroll"><div class="pad">
    <div class="list" id="sessions"><div class="skeleton"></div><div class="skeleton"></div></div>
    <p class="note" id="mode-note"></p>
  </div></div>
</section>

<section class="view hidden-right" id="v-chat">
  <div class="top">
    <button class="icon" data-back aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1><span id="chat-title"></span><span class="sub" id="chat-sub"></span></h1>
    <button class="make-main" id="make-main">Основная</button>
  </div>
  <div class="scroll" id="chat-scroll"><div class="chat" id="chat"></div></div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Сообщение" enterkeyhint="send"></textarea>
    <button class="send" id="send" aria-label="Отправить" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </div>
</section>

<section class="view hidden-right" id="v-settings">
  <div class="top">
    <button class="icon" data-back aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1>Уведомления</h1>
  </div>
  <div class="scroll"><div class="pad">
    <div class="list" id="settings"></div>
    <p class="note">Изменения сохраняются сразу. Основная сессия присылает ответы в чат целиком — её выбирают кнопкой «Основная» в переписке.</p>
  </div></div>
</section>

</div>
<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram && Telegram.WebApp;
  const API = new URLSearchParams(location.search).get("api");
  const OPTIONS = [
    ["mode", "Режим работы", [["telegram", "Telegram"], ["vscode", "VS Code"]]],
    ["progress", "Основная сессия", [[false, "Только итог"], [true, "Весь ход"]]],
    ["others", "Другие сессии", [["off", "Молчат"], ["short", "«Готово»"], ["full", "Итог"]]],
    ["questions", "Вопросы Claude", [[true, "С кнопками"], [false, "Только VS Code"]]],
  ];
  const STATUS = { work: "пишет…", idle: "открыта", sleep: "спит" };
  const SENT = { delivered: "доставлено", queued: "в очереди — сессия спит", headless: "выполняется в фоне",
                 busy: "сессия ещё отвечает", no_claude: "не найден Claude в VS Code" };
  const PALETTE = ["#a9a3d1", "#9cbca5", "#d4b59e", "#c9a3b6", "#94b3c9", "#b8b38f"];
  let data = null, view = "list", openId = null, lastHistory = "";
  const $ = id => document.getElementById(id);
  const seen = (() => { try { return JSON.parse(localStorage.getItem("seen") || "{}"); } catch (e) { return {}; } })();
  function markSeen(id, at) { seen[id] = at; try { localStorage.setItem("seen", JSON.stringify(seen)); } catch (e) {} }

  // ---------- сеть ----------
  async function api(path, body) {
    const res = await fetch(API + path, {
      method: body ? "POST" : "GET", cache: "no-store",
      headers: Object.assign({ "X-Init-Data": tg ? tg.initData : "" }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }
  function online(ok) {
    $("offline").classList.toggle("on", !ok);
    if (!ok) $("list-sub").textContent = "нет связи с компьютером";
  }
  function toast(text) {
    const t = $("toast"); t.textContent = text; t.classList.add("on");
    clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("on"), 1800);
  }
  function haptic(kind) { try { kind ? tg.HapticFeedback.notificationOccurred(kind) : tg.HapticFeedback.selectionChanged(); } catch (e) {} }

  // ---------- текст как в Telegram ----------
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function codeBlock(lang, code) {
    return `<div class="code"><div class="code-head"><span>${esc(lang || "код")}</span><button data-copy>Копировать</button></div><pre>${esc(code)}</pre></div>`;
  }
  function md(text) {
    const keep = [], stash = h => "\u0000" + (keep.push(h) - 1) + "\u0000";
    text = text.replace(/```([\w+#.-]*)[^\n]*\n?([\s\S]*?)(```|$)/g, (_, lang, c) => stash(codeBlock(lang, c.replace(/\n$/, ""))));
    text = text.replace(/((?:^|\n)\|.*(?:\n\|.*)*)/g, t => {
      const rows = t.trim().split("\n").filter(l => !/^\|?[\s:|-]+\|?$/.test(l))
        .map(l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.replace(/\*\*|`/g, "").trim()));
      const w = rows[0].map((_, i) => Math.max(...rows.map(r => (r[i] || "").length)));
      return "\n" + stash(codeBlock("таблица", rows.map(r => r.map((c, i) => c.padEnd(w[i])).join("  ").trimEnd()).join("\n"))) + "\n";
    });
    text = text.replace(/`([^`\n]+)`/g, (_, c) => stash("<code>" + esc(c) + "</code>"));
    text = esc(text)
      .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/^#{1,6}\s+(.+)$/gm, "<b>$1</b>")
      .replace(/^\s*-{3,}\s*$/gm, "")
      .replace(/^(?:&gt;\s?(.*)(?:\n|$))+/gm, m => stash("<blockquote>" + m.replace(/^&gt;\s?/gm, "").trim().replace(/\n/g, "<br>") + "</blockquote>"))
      .replace(/^(\s*)[-*]\s+/gm, "$1• ")
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/~~(.+?)~~/g, "<s>$1</s>")
      .replace(/(^|[^\w*])\*(?!\s)([^*\n]+?)\*(?![\w*])/g, "$1<i>$2</i>");
    return text.split(/\n{2,}/).filter(p => p.trim()).map(p => "<p>" + p.trim().replace(/\n/g, "<br>") + "</p>").join("")
      .replace(/<p>(\u0000\d+\u0000)<\/p>/g, "$1")
      .replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
  }
  const hhmm = d => d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  function when(ts) {
    const d = new Date(ts * 1000), now = new Date();
    if (d.toDateString() === now.toDateString()) return hhmm(d);
    return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
  }
  function dayLabel(d) {
    const now = new Date(), y = new Date(now - 864e5);
    if (d.toDateString() === now.toDateString()) return "Сегодня";
    if (d.toDateString() === y.toDateString()) return "Вчера";
    return d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  }
  function avatar(s) {
    let h = 0; for (const c of s.t) h = (h * 31 + c.codePointAt(0)) >>> 0;
    const letter = (s.t.match(/[\p{L}\p{N}]/u) || ["#"])[0].toUpperCase();
    return `<div class="ava" style="background:${PALETTE[h % PALETTE.length]}">${esc(letter)}<i class="dot ${esc(s.st)}"></i></div>`;
  }

  // ---------- навигация ----------
  function show(name) {
    const order = { list: 0, chat: 1, settings: 1 };
    ["list", "chat", "settings"].forEach(v => {
      const el = $("v-" + v);
      el.classList.toggle("hidden-right", v !== name && order[v] >= order[name]);
      el.classList.toggle("hidden-left", v !== name && order[v] < order[name]);
    });
    view = name;
    if (tg && tg.BackButton && tg.isVersionAtLeast && tg.isVersionAtLeast("6.1")) name === "list" ? tg.BackButton.hide() : tg.BackButton.show();
    if (name === "list") { $("input").blur(); openId = null; renderList(); }
  }
  function back() {
    if (document.activeElement === $("input")) { $("input").blur(); return; }  // сначала закрываем клавиатуру
    show("list");
  }

  // ---------- экраны ----------
  function renderList() {
    if (!data) return;
    const n = data.sessions.length, n10 = n % 10, n100 = n % 100;
    const word = n10 === 1 && n100 !== 11 ? "сессия открыта" : n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14) ? "сессии открыты" : "сессий открыто";
    $("list-sub").textContent = data.settings.mode === "vscode" ? "режим VS Code · уведомления выключены" : `${n} ${word}`;
    const box = $("sessions");
    if (!data.sessions.length) { box.innerHTML = '<div class="empty">Нет открытых вкладок Claude в VS Code</div>'; return; }
    box.innerHTML = data.sessions.map(s => {
      const fresh = s.at && seen[s.id] !== undefined && s.at > seen[s.id] && s.st !== "work";
      return `<div class="row tap" data-id="${esc(s.id)}">${avatar(s)}
        <div class="grow"><div class="line1"><b>${esc(s.t)}</b><time>${s.at ? when(s.at) : ""}</time></div>
        <div class="line2"><span>#${esc(s.id)} · ${STATUS[s.st] || ""}</span>
        ${s.id === data.selected ? '<span class="chip">основная</span>' : ""}${fresh ? '<span class="badge"></span>' : ""}</div></div></div>`;
    }).join("");
    box.querySelectorAll(".row").forEach(r => r.onclick = () => { haptic(); openChat(r.dataset.id); });
    $("mode-note").textContent = "Нажми сессию, чтобы открыть переписку и написать ей.";
  }

  function renderChatHeader() {
    const s = data && data.sessions.find(x => x.id === openId);
    if (!s) return;
    $("chat-title").textContent = s.t;
    $("chat-sub").textContent = `#${s.id} · ${STATUS[s.st] || ""}`;
    $("make-main").style.display = s.id === data.selected ? "none" : "";
    if (s.at) markSeen(s.id, s.at);
  }

  async function loadHistory(scroll) {
    if (!openId) return;
    try {
      const res = await api("/api/history?id=" + encodeURIComponent(openId));
      online(true);
      const key = JSON.stringify(res.items);
      if (key === lastHistory) return;
      lastHistory = key;
      const sc = $("chat-scroll"), atBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 120;
      let lastDay = "";
      $("chat").innerHTML = res.items.length ? res.items.map(m => {
        const d = m.ts ? new Date(m.ts) : null, day = d ? d.toDateString() : "";
        const sep = day && day !== lastDay ? `<div class="day">${dayLabel(d)}</div>` : "";
        lastDay = day || lastDay;
        return `${sep}<div class="msg ${m.r}">${md(m.x)}<span class="time">${d ? hhmm(d) : ""}</span></div>`;
      }).join("") : '<div class="empty">Переписки пока нет</div>';
      if (scroll || atBottom) sc.scrollTop = sc.scrollHeight;
    } catch (e) { online(false); }
  }

  function openChat(id) {
    openId = id; lastHistory = "";
    $("chat").innerHTML = '<div class="empty">Загрузка…</div>';
    renderChatHeader(); show("chat"); loadHistory(true);
  }

  async function sendMessage() {
    const input = $("input"), text = input.value.trim();
    if (!text || !openId) return;
    $("send").disabled = true;
    try {
      const res = await api("/api/send", { id: openId, text });
      input.value = ""; autosize();
      $("chat").insertAdjacentHTML("beforeend", `<div class="msg user">${md(text)}<span class="time">${hhmm(new Date())}</span></div><div class="pending">${SENT[res.status] || res.status}</div>`);
      $("chat-scroll").scrollTop = $("chat-scroll").scrollHeight;
      haptic("success");
    } catch (e) { online(false); toast("Не отправлено — нет связи"); haptic("error"); }
    $("send").disabled = !input.value.trim();
  }

  function renderSettings() {
    const cfg = data ? data.settings : {};
    $("settings").innerHTML = OPTIONS.map(([key, title, vals]) => `
      <div class="opt"><label>${title}</label><div class="seg">
        ${vals.map(([v, t], i) => `<button data-k="${key}" data-i="${i}" class="${cfg[key] === v ? "on" : ""}">${t}</button>`).join("")}
      </div></div>`).join("");
    $("settings").querySelectorAll("button").forEach(btn => btn.onclick = async () => {
      if (!data) return;
      const key = btn.dataset.k, before = data.settings[key];
      const value = OPTIONS.find(o => o[0] === key)[2][+btn.dataset.i][0];
      if (value === before) return;
      haptic(); data.settings[key] = value; renderSettings();  // сразу, без ожидания туннеля
      try { data = await api("/api/settings", { settings: { [key]: value } }); online(true); }
      catch (e) { data.settings[key] = before; online(false); toast("Не сохранилось — нет связи"); }
      renderSettings();
    });
  }

  async function refresh() {
    try { data = await api("/api/state"); online(true); } catch (e) { online(false); return; }
    if (view === "list") renderList();
    if (view === "chat") renderChatHeader();
  }

  function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 150) + "px"; }

  // ---------- старт ----------
  function applyTheme() {
    const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    if (tg) try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor && tg.setBottomBarColor(bg); } catch (e) {}
  }
  applyTheme();
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    const v = x => tg.isVersionAtLeast && tg.isVersionAtLeast(x);
    if (v("8.0")) try { tg.requestFullscreen(); } catch (e) {}
    if (v("7.7")) try { tg.disableVerticalSwipes(); } catch (e) {}  // свайп вниз не закрывает панель случайно
    if (v("6.1")) try { tg.BackButton.onClick(back); } catch (e) {}
    try { tg.onEvent("themeChanged", applyTheme); } catch (e) {}
  }
  // зум жестами выключен (iOS игнорирует user-scalable=no без этого)
  ["gesturestart", "gesturechange"].forEach(e => document.addEventListener(e, ev => ev.preventDefault(), { passive: false }));
  document.addEventListener("touchmove", e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  // клавиатура закрывается тапом по переписке или прокруткой
  $("chat-scroll").addEventListener("touchstart", () => $("input").blur(), { passive: true });
  $("chat-scroll").addEventListener("mousedown", () => $("input").blur());
  $("chat").addEventListener("click", e => {
    const btn = e.target.closest("[data-copy]");
    if (!btn) return;
    const code = btn.closest(".code").querySelector("pre").innerText;
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(
      () => { toast("Код скопирован"); haptic("success"); },
      () => { const r = document.createRange(); r.selectNodeContents(btn.closest(".code").querySelector("pre"));
              getSelection().removeAllRanges(); getSelection().addRange(r); toast("Выделено — скопируй"); });
  });

  document.querySelectorAll("[data-back]").forEach(b => b.onclick = back);
  $("to-settings").onclick = () => { haptic(); renderSettings(); show("settings"); };
  $("make-main").onclick = async () => {
    haptic();
    try { data = await api("/api/select", { id: openId }); renderChatHeader(); toast("Теперь это основная сессия"); }
    catch (e) { online(false); }
  };
  $("input").oninput = () => { autosize(); $("send").disabled = !$("input").value.trim(); };
  $("input").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey || !matchMedia("(pointer: coarse)").matches) && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
  $("send").onclick = sendMessage;

  show("list");
  if (!API) { online(false); $("sessions").innerHTML = '<div class="empty">Открой панель кнопкой «Панель» в чате с ботом</div>'; }
  else {
    refresh();
    setInterval(refresh, 5000);
    setInterval(() => view === "chat" && loadHistory(false), 4000);
  }
</script>
</body>
</html>
