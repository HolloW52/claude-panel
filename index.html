<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claude Code</title>
<link rel="icon" href="data:,">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f3f2f0; --card: #fbfbfa; --line: #e4e2df; --text: #3b3a3f; --muted: #8f8c95;
    --accent: #aaa5cf; --accent-soft: #ebe9f4; --sage: #9fbea8; --sleep: #cfccc8; --mine: #e8e6f3;
  }
  :root[data-theme="dark"] {
    --bg: #1d1d20; --card: #26262a; --line: #33333a; --text: #e6e5ea; --muted: #8e8b96;
    --accent: #9b96c6; --accent-soft: #2f2e3a; --sage: #8fae98; --sleep: #55535a; --mine: #34333f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  .view { display: none; max-width: 560px; margin: 0 auto; min-height: 100%; }
  .view.on { display: flex; flex-direction: column; }
  #v-chat.on { height: 100vh; height: var(--tg-viewport-stable-height, 100dvh); }
  .top { display: flex; align-items: center; gap: 10px; padding: 16px 16px 10px; }
  .top h1 { flex: 1; font-size: 17px; font-weight: 600; margin: 0; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
  .icon:active { background: var(--accent-soft); }
  .icon svg { width: 19px; height: 19px; }
  .pad { padding: 0 16px 24px; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); margin: 14px 4px 8px; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .tap { cursor: pointer; transition: background .15s; }
  .tap:active { background: var(--accent-soft); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--sleep); }
  .dot.work { background: var(--sage); animation: pulse 1.6s ease-in-out infinite; }
  .dot.idle { background: var(--accent); }
  @keyframes pulse { 50% { opacity: .35; } }
  .grow { flex: 1; min-width: 0; }
  .grow b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 12px; color: var(--muted); }
  .chip { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--accent-soft); color: var(--muted); flex: none; }
  .chev { color: var(--muted); flex: none; }
  .note { font-size: 12px; color: var(--muted); margin: 10px 4px 0; }
  .banner { margin: 0 16px 10px; padding: 10px 12px; border-radius: 12px; font-size: 13px;
    background: var(--accent-soft); color: var(--muted); display: none; }
  .banner.on { display: block; }
  .empty { padding: 22px 14px; color: var(--muted); text-align: center; font-size: 14px; }

  /* сессия */
  .status { padding: 0 16px 8px 60px; margin-top: -8px; display: flex; align-items: center; gap: 8px; }
  .status .dot { width: 7px; height: 7px; }
  .make-main { margin-left: auto; font-size: 12px; padding: 5px 10px; border-radius: 20px;
    background: var(--accent-soft); color: var(--text); }
  .chat { flex: 1; overflow-y: auto; padding: 8px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 88%; padding: 9px 12px; border-radius: 14px; background: var(--card);
    border: 1px solid var(--line); word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--mine); border-color: transparent; }
  .msg .time { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; text-align: right; }
  .msg p { margin: 0 0 6px; } .msg p:last-child { margin: 0; }
  .msg pre { margin: 6px 0; padding: 8px 10px; background: var(--bg); border-radius: 8px; overflow-x: auto;
    font: 12.5px/1.4 ui-monospace, Consolas, monospace; white-space: pre; }
  .msg code { font: 13px ui-monospace, Consolas, monospace; background: var(--bg); padding: 1px 4px; border-radius: 4px; }
  .msg a { color: var(--accent); }
  .pending { align-self: flex-end; font-size: 12px; color: var(--muted); margin-top: -4px; }
  .composer { position: sticky; bottom: 0; display: flex; align-items: flex-end; gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
  .composer textarea { flex: 1; resize: none; border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 18px; padding: 9px 14px; font: inherit; max-height: 140px; outline: none; }
  .composer textarea:focus { border-color: var(--accent); }
  .send { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  .send:disabled { opacity: .45; }
  .send svg { width: 18px; height: 18px; }

  /* настройки */
  .opt { padding: 12px 14px; border-top: 1px solid var(--line); }
  .opt:first-child { border-top: 0; }
  .opt label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; font-size: 13px; padding: 7px 4px; border-radius: 8px; transition: background .15s; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.08); font-weight: 500; }
</style>
</head>
<body>

<section class="view" id="v-list">
  <div class="top">
    <h1>Claude Code</h1>
    <button class="icon" id="to-settings" aria-label="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div class="banner" id="offline">Компьютер не на связи — открой VS Code, панель подключится сама.</div>
  <div class="pad">
    <h2>Сессии</h2>
    <div class="list" id="sessions"><div class="empty">Загрузка…</div></div>
    <p class="note"><span id="mode-note"></span></p>
  </div>
</section>

<section class="view" id="v-chat">
  <div class="top">
    <button class="icon" data-back aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="chat-title"></h1>
  </div>
  <div class="status"><i class="dot" id="chat-dot"></i><span class="sub" id="chat-sub"></span>
    <button class="make-main" id="make-main">Сделать основной</button></div>
  <div class="chat" id="chat"></div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Сообщение сессии…"></textarea>
    <button class="send" id="send" aria-label="Отправить" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </div>
</section>

<section class="view" id="v-settings">
  <div class="top">
    <button class="icon" data-back aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1>Уведомления</h1>
  </div>
  <div class="pad">
    <div class="list" id="settings"></div>
    <p class="note">Изменения сохраняются сразу. «Основная» сессия — та, чьи ответы приходят в чат целиком;
      ещё её выбирают кнопкой «Сделать основной» в переписке.</p>
  </div>
</section>

<script>
  const tg = window.Telegram && Telegram.WebApp;
  const API = new URLSearchParams(location.search).get("api");
  const OPTIONS = [
    ["mode", "Режим работы", [["telegram", "Telegram"], ["vscode", "VS Code"]]],
    ["progress", "Основная сессия", [[false, "Только итог"], [true, "Весь ход"]]],
    ["others", "Другие сессии", [["off", "Молчат"], ["short", "«Готово»"], ["full", "Итог"]]],
    ["questions", "Вопросы Claude", [[true, "С кнопками"], [false, "Только VS Code"]]],
  ];
  const STATUS = { work: "пишет", idle: "открыта", sleep: "спит" };
  const SENT = { delivered: "доставлено", queued: "в очереди — сессия спит", headless: "выполняется в фоне",
                 busy: "сессия ещё отвечает — подожди", no_claude: "не найден Claude в VS Code" };
  let data = null, view = "list", openId = null, lastHistory = "";
  const $ = id => document.getElementById(id);

  // ---------- сеть ----------
  async function api(path, body) {
    const res = await fetch(API + path, {
      method: body ? "POST" : "GET",
      headers: Object.assign({ "X-Init-Data": tg ? tg.initData : "" }, body ? { "Content-Type": "application/json" } : {}),
      body: body ? JSON.stringify(body) : undefined, cache: "no-store",
    });
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }
  function online(ok) { $("offline").classList.toggle("on", !ok); }

  // ---------- форматирование ----------
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function ago(ts) {
    const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
    if (s < 60) return "только что";
    if (s < 3600) return Math.floor(s / 60) + " мин назад";
    if (s < 86400) return Math.floor(s / 3600) + " ч назад";
    return Math.floor(s / 86400) + " дн назад";
  }
  function md(text) {
    const keep = [];
    const stash = h => "\u0000" + (keep.push(h) - 1) + "\u0000";
    text = text.replace(/```[^\n]*\n?([\s\S]*?)(```|$)/g, (_, c) => stash("<pre>" + esc(c.replace(/\n$/, "")) + "</pre>"));
    text = text.replace(/((?:^|\n)\|.*(?:\n\|.*)*)/g, t => {
      const rows = t.trim().split("\n").filter(l => !/^\|?[\s:|-]+\|?$/.test(l))
        .map(l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.replace(/\*\*|`/g, "").trim()));
      const w = rows[0].map((_, i) => Math.max(...rows.map(r => (r[i] || "").length)));
      return "\n" + stash("<pre>" + esc(rows.map(r => r.map((c, i) => c.padEnd(w[i])).join("  ").trimEnd()).join("\n")) + "</pre>");
    });
    text = text.replace(/`([^`\n]+)`/g, (_, c) => stash("<code>" + esc(c) + "</code>"));
    text = esc(text)
      .replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>')
      .replace(/^#{1,6}\s+(.+)$/gm, "<b>$1</b>")
      .replace(/^\s*-{3,}\s*$/gm, "")
      .replace(/^(\s*)[-*]\s+/gm, "$1• ")
      .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
      .replace(/~~(.+?)~~/g, "<s>$1</s>")
      .replace(/(^|[^\w*])\*(?!\s)([^*\n]+?)\*(?![\w*])/g, "$1<i>$2</i>");
    const html = text.split(/\n{2,}/).map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
    return html.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
  }

  // ---------- экраны ----------
  function show(name) {
    view = name;
    ["list", "chat", "settings"].forEach(v => $("v-" + v).classList.toggle("on", v === name));
    if (tg && tg.BackButton) name === "list" ? tg.BackButton.hide() : tg.BackButton.show();
    if (name === "list") { openId = null; renderList(); }
  }
  function haptic() { try { tg.HapticFeedback.selectionChanged(); } catch (e) {} }

  function renderList() {
    const box = $("sessions");
    if (!data) return;
    if (!data.sessions.length) { box.innerHTML = '<div class="empty">Нет открытых вкладок Claude в VS Code</div>'; return; }
    box.innerHTML = data.sessions.map(s => `
      <div class="row tap" data-id="${esc(s.id)}">
        <i class="dot ${esc(s.st)}"></i>
        <div class="grow"><b>${esc(s.t)}</b><span class="sub">${STATUS[s.st] || ""} · ${s.at ? ago(s.at) : ""}</span></div>
        ${s.id === data.selected ? '<span class="chip">основная</span>' : ""}
        <span class="chev">›</span>
      </div>`).join("");
    box.querySelectorAll(".row").forEach(r => r.onclick = () => { haptic(); openChat(r.dataset.id); });
    $("mode-note").textContent = data.settings.mode === "vscode"
      ? "Режим VS Code: уведомления в чат выключены." : "Режим Telegram: уведомления по настройкам.";
  }

  function renderChatHeader() {
    const s = data && data.sessions.find(x => x.id === openId);
    if (!s) return;
    $("chat-title").textContent = s.t;
    $("chat-dot").className = "dot " + s.st;
    $("chat-sub").textContent = `#${s.id} · ${STATUS[s.st] || ""}`;
    $("make-main").style.display = s.id === data.selected ? "none" : "";
  }

  async function loadHistory(scroll) {
    if (!openId) return;
    try {
      const res = await api("/api/history?id=" + encodeURIComponent(openId));
      const key = JSON.stringify(res.items);
      if (key === lastHistory) return;
      lastHistory = key;
      const box = $("chat");
      const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
      box.innerHTML = res.items.length ? res.items.map(m => `
        <div class="msg ${m.r}">${md(m.x)}<span class="time">${m.ts ? new Date(m.ts).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) : ""}</span></div>`).join("")
        : '<div class="empty">Переписки пока нет</div>';
      if (scroll || atBottom) box.scrollTop = box.scrollHeight;
      online(true);
    } catch (e) { online(false); }
  }

  function openChat(id) {
    openId = id; lastHistory = ""; $("chat").innerHTML = '<div class="empty">Загрузка…</div>';
    renderChatHeader(); show("chat"); loadHistory(true);
  }

  async function sendMessage() {
    const input = $("input"), text = input.value.trim();
    if (!text || !openId) return;
    $("send").disabled = true;
    try {
      const res = await api("/api/send", { id: openId, text });
      input.value = ""; autosize();
      const box = $("chat");
      box.insertAdjacentHTML("beforeend", `<div class="msg user">${md(text)}</div><div class="pending">${SENT[res.status] || res.status}</div>`);
      box.scrollTop = box.scrollHeight;
      if (tg) try { tg.HapticFeedback.notificationOccurred("success"); } catch (e) {}
    } catch (e) {
      online(false);
    }
    $("send").disabled = !$("input").value.trim();
  }

  function renderSettings() {
    const cfg = data ? data.settings : {};
    $("settings").innerHTML = OPTIONS.map(([key, title, vals]) => `
      <div class="opt"><label>${title}</label><div class="seg">
        ${vals.map(([v, t], i) => `<button data-k="${key}" data-i="${i}" class="${cfg[key] === v ? "on" : ""}">${t}</button>`).join("")}
      </div></div>`).join("");
    $("settings").querySelectorAll("button").forEach(btn => btn.onclick = async () => {
      const [, , vals] = OPTIONS.find(o => o[0] === btn.dataset.k);
      const key = btn.dataset.k, before = data.settings[key];
      haptic();
      data.settings[key] = vals[+btn.dataset.i][0];
      renderSettings();  // сразу, не дожидаясь ответа через туннель
      try { data = await api("/api/settings", { settings: { [key]: data.settings[key] } }); online(true); }
      catch (e) { data.settings[key] = before; online(false); }
      renderSettings();
    });
  }

  async function refresh() {
    try { data = await api("/api/state"); online(true); } catch (e) { online(false); return; }
    if (view === "list") renderList();
    if (view === "chat") renderChatHeader();
  }

  function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 140) + "px"; }

  // ---------- старт ----------
  function applyTheme() {
    const dark = tg && tg.colorScheme ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    if (tg) try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch (e) {}
  }
  applyTheme();
  if (tg) {
    try { tg.ready(); tg.expand(); tg.onEvent("themeChanged", applyTheme); tg.BackButton.onClick(() => show("list")); } catch (e) {}
  }
  document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => show("list"));
  $("to-settings").onclick = () => { haptic(); renderSettings(); show("settings"); };
  $("make-main").onclick = async () => {
    haptic();
    try { data = await api("/api/select", { id: openId }); renderChatHeader(); } catch (e) { online(false); }
  };
  $("input").oninput = () => { autosize(); $("send").disabled = !$("input").value.trim(); };
  $("input").onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) sendMessage(); };
  $("send").onclick = sendMessage;

  show("list");
  if (!API) { online(false); $("sessions").innerHTML = '<div class="empty">Открой панель кнопкой «Панель» в чате с ботом</div>'; }
  else {
    refresh();
    setInterval(refresh, 5000);
    setInterval(() => view === "chat" && loadHistory(false), 4000);
  }
</script>
</body>
</html>
